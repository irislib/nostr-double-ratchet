[workspace]
resolver = "2"
members = [
    "crates/nostr-double-ratchet",
    "crates/nostr-double-ratchet-pairwise",
    "crates/nostr-double-ratchet-pairwise-codec",
    "crates/ndr-pairwise-ffi",
]

[workspace.package]
version = "0.0.167"
edition = "2021"
authors = ["Martti Malmi"]
license = "MIT"
repository = "https://files.iris.to/#/npub1xdhnr9mrv47kkrn95k6cwecearydeh8e895990n3acntwvmgk2dsdeeycm/nostr-double-ratchet"

[workspace.dependencies]
nostr-double-ratchet = { version = "0.0.167", path = "crates/nostr-double-ratchet", default-features = false }
nostr-double-ratchet-pairwise = { version = "0.0.167", path = "crates/nostr-double-ratchet-pairwise" }
nostr-double-ratchet-pairwise-codec = { version = "0.0.167", path = "crates/nostr-double-ratchet-pairwise-codec" }
nostr = { version = "0.44.7", default-features = false, features = ["std", "nip44"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hkdf = "0.12"
sha2 = "0.10"
hex = { version = "0.4", features = ["serde"] }
thiserror = "2"
base64 = "0.22"
chacha20poly1305 = "0.10"
urlencoding = "2.1"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
fs2 = "0.4"
zeroize = "1"
uniffi = { version = "0.29.4", default-features = false }
