[workspace]
resolver = "2"
members = [
    "crates/nostr-double-ratchet",
    "crates/nostr-double-ratchet-pairwise-codec",
]

[workspace.package]
version = "0.0.164"
edition = "2021"
authors = ["Martti Malmi"]
license = "MIT"
repository = "https://files.iris.to/#/npub1xdhnr9mrv47kkrn95k6cwecearydeh8e895990n3acntwvmgk2dsdeeycm/nostr-double-ratchet"

[workspace.dependencies]
nostr-double-ratchet = { version = "0.0.164", path = "crates/nostr-double-ratchet" }
nostr-double-ratchet-pairwise-codec = { version = "0.0.164", path = "crates/nostr-double-ratchet-pairwise-codec" }
nostr = { version = "0.44.2", default-features = false, features = ["std", "nip44"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hkdf = "0.12"
sha2 = "0.10"
hex = { version = "0.4", features = ["serde"] }
thiserror = "2"
base64 = "0.22"
urlencoding = "2.1"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
