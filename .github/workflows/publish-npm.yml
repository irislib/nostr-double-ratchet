name: Publish npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version to publish (must match master)
        type: string
        required: true
      dry_run:
        description: Validate without publishing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'irislib/nostr-double-ratchet' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Find successful CI for this commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=master&event=push&head_sha=$GITHUB_SHA&status=success&per_page=1" --jq '.workflow_runs[0].id // empty')
          if [[ -z "$run_id" ]]; then
            echo "CI must pass on this exact master commit before publishing." >&2
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download the package tested by CI
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package-${{ github.sha }}
          path: package
          run-id: ${{ steps.ci.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Use Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify package identity and requested version
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          [[ "$EXPECTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          package="$GITHUB_WORKSPACE/package/nostr-double-ratchet-$EXPECTED_VERSION.tgz"
          test -f "$package"
          tar -xOf "$package" package/package.json > "$RUNNER_TEMP/npm-manifest.json"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/npm-manifest.json`, 'utf8'));
          assert.equal(manifest.name, 'nostr-double-ratchet');
          assert.equal(manifest.version, process.env.EXPECTED_VERSION);
          assert.equal(manifest.repository.url, `git+https://github.com/${process.env.GITHUB_REPOSITORY}.git`);
          JS
          echo "NPM_TARBALL=$package" >> "$GITHUB_ENV"
          echo "NPM_INTEGRITY=sha512-$(openssl dgst -sha512 -binary "$package" | openssl base64 -A)" >> "$GITHUB_ENV"

      - name: Validate publication
        run: npm publish "$NPM_TARBALL" --dry-run --ignore-scripts --access public --tag latest

      - name: Check for an existing identical release
        id: existing
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { appendFileSync } from 'node:fs';
          const response = await fetch(`https://registry.npmjs.org/nostr-double-ratchet/${process.env.EXPECTED_VERSION}`, { signal: AbortSignal.timeout(15000) });
          if (response.status === 404) {
            appendFileSync(process.env.GITHUB_OUTPUT, 'published=false\n');
          } else {
            assert.ok(response.ok, `Registry returned ${response.status}`);
            const published = await response.json();
            assert.equal(published.dist.integrity, process.env.NPM_INTEGRITY, 'Published version differs from the tested artifact');
            appendFileSync(process.env.GITHUB_OUTPUT, 'published=true\n');
            console.log('The identical tested package is already published.');
          }
          JS

      - name: Publish with npm trusted publishing
        if: ${{ !inputs.dry_run && steps.existing.outputs.published != 'true' }}
        run: npm publish "$NPM_TARBALL" --ignore-scripts --provenance --access public --tag latest

      - name: Verify the published package
        if: ${{ !inputs.dry_run }}
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { setTimeout } from 'node:timers/promises';
          const url = 'https://registry.npmjs.org/nostr-double-ratchet';
          for (let attempt = 0; attempt < 18; attempt += 1) {
            const response = await fetch(`${url}/${process.env.EXPECTED_VERSION}`, { signal: AbortSignal.timeout(15000) });
            if (response.ok) {
              const published = await response.json();
              assert.equal(published.dist.integrity, process.env.NPM_INTEGRITY, 'Registry tarball differs from the tested artifact');
              const latest = await fetch(`${url}/latest`, { signal: AbortSignal.timeout(15000) });
              if (latest.ok && (await latest.json()).version === process.env.EXPECTED_VERSION) {
                console.log('Published package integrity and latest tag verified.');
                process.exit(0);
              }
            } else {
              assert.ok(response.status === 404 || response.status >= 500, `Registry returned ${response.status}`);
            }
            if (attempt < 17) {
              console.log('Waiting for npm registry processing...');
              await setTimeout(10000);
            }
          }
          throw new Error('npm did not expose the expected package and latest tag within the verification window');
          JS
