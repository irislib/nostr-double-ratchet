name: Ratchet recovery comparison
on:
  push:
    branches: [codex/ratchet-recovery-profile-20261126]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CANDIDATE_SHA: cb75115c999e24217ff3c69f99dd25435129557c
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install verified Node.js and pnpm
        run: python3 rust/scripts/ci-build-inputs.py --install-node
      - name: Install frozen test dependencies
        working-directory: ts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Compare immutable revisions on the same two CPUs
        run: python3 scripts/profile-group-recovery.py
      - name: Retain comparison logs and inputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recovery-profile-${{ github.sha }}
          path: |
            ${{ runner.temp }}/recovery-profile/*.log
            ${{ runner.temp }}/recovery-profile/results.json
            ${{ runner.temp }}/ndr-ci-tools/receipt.json
            scripts/profile-group-recovery.*
          if-no-files-found: error
