name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  source-size:
    name: Source size
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Enforce source file limits
      run: ./scripts/check-source-size.sh

  test-ts:
    name: TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Install pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        package_json_file: ts/package.json

    - name: Use Node.js 24.x
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: 24.x
        cache: 'pnpm'
        cache-dependency-path: ts/pnpm-lock.yaml

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Run linter
      run: pnpm lint

    - name: Build project
      run: pnpm build

    - name: Run tests
      run: pnpm test:once

    - name: Pack and test the npm artifact
      run: |
        mkdir -p "$RUNNER_TEMP/npm-package" "$RUNNER_TEMP/npm-smoke"
        npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/npm-package"
        npm install --prefix "$RUNNER_TEMP/npm-smoke" --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP/npm-package/"*.tgz
        cp tests/package-smoke.mjs "$RUNNER_TEMP/npm-smoke/check.mjs"
        timeout 30s node "$RUNNER_TEMP/npm-smoke/check.mjs"

    - name: Save the tested npm artifact
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: npm-package-${{ github.sha }}
        path: ${{ runner.temp }}/npm-package/*.tgz
        if-no-files-found: error
        retention-days: 30

  test-rust:
    name: Rust
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: rust

    - name: Install pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        package_json_file: ts/package.json

    - name: Use Node.js 24.x
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: 24.x
        cache: 'pnpm'
        cache-dependency-path: ts/pnpm-lock.yaml

    - name: Install TS dependencies
      working-directory: ts
      run: pnpm install --frozen-lockfile

    - name: Run tests
      run: cargo test --locked

    - name: Check minimal pairwise FFI feature graph
      run: cargo check --locked -p ndr-pairwise-ffi --no-default-features --lib

    - name: Check formatting
      run: cargo fmt --check

    - name: Run clippy
      run: cargo clippy --locked -- -D warnings

  formal:
    name: Formal
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Run TLA+ model checks
      run: |
        ./formal/session_manager_fanout/run_tlc.sh --mode ci
        ./formal/group_sender_keys/run_tlc.sh --mode ci
        ./formal/invite_handshake/run_tlc.sh --mode ci
        ./formal/session_lifecycle/run_tlc.sh --mode ci

  interop:
    name: Interop Tests
    runs-on: ubuntu-latest
    needs: [source-size, test-ts, test-rust, formal]

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Install pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        package_json_file: ts/package.json

    - name: Use Node.js 24.x
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: 24.x
        cache: 'pnpm'
        cache-dependency-path: ts/pnpm-lock.yaml

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: rust

    - name: Install TS dependencies
      working-directory: ts
      run: pnpm install --frozen-lockfile

    - name: Generate TypeScript interop vectors
      working-directory: ts
      env:
        REGENERATE_VECTORS: "true"
      run: pnpm vitest run tests/interop.test.ts tests/*.interop.test.ts

    - name: Generate Rust interop vectors
      working-directory: rust
      env:
        REGENERATE_VECTORS: "true"
      run: cargo test --locked --workspace generate -- --ignored --test-threads=1 --nocapture

    - name: Verify Rust interop consumers
      working-directory: rust
      run: cargo test --locked --workspace

    - name: Verify TypeScript interop consumers
      working-directory: ts
      run: pnpm vitest run tests/interop.test.ts tests/*.interop.test.ts
