name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test-ts:
    name: TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts

    steps:
    - uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'pnpm'
        cache-dependency-path: ts/pnpm-lock.yaml

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Run linter
      run: pnpm lint

    - name: Build project
      run: pnpm build

    - name: Run tests
      run: pnpm test:once

  test-rust:
    name: Rust
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: rust

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'pnpm'
        cache-dependency-path: ts/pnpm-lock.yaml

    - name: Install TS dependencies
      working-directory: ts
      run: pnpm install --frozen-lockfile

    - name: Run tests
      run: cargo test

    - name: Check formatting
      run: cargo fmt --check

    - name: Run clippy
      run: cargo clippy -- -D warnings

  formal:
    name: Formal
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Run TLA+ model checks
      run: |
        ./formal/session_manager_fanout/run_tlc.sh --mode ci
        ./formal/group_sender_keys/run_tlc.sh --mode ci
        ./formal/invite_handshake/run_tlc.sh --mode ci
        ./formal/session_lifecycle/run_tlc.sh --mode ci

  interop:
    name: Interop Tests
    runs-on: ubuntu-latest
    needs: [test-ts, test-rust, formal]

    steps:
    - uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'pnpm'
        cache-dependency-path: ts/pnpm-lock.yaml

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: rust

    - name: Install TS dependencies
      working-directory: ts
      run: pnpm install --frozen-lockfile

    - name: Generate TypeScript interop vectors
      working-directory: ts
      env:
        REGENERATE_VECTORS: "true"
      run: pnpm vitest run tests/interop.test.ts tests/*.interop.test.ts

    - name: Generate Rust interop vectors
      working-directory: rust
      env:
        REGENERATE_VECTORS: "true"
      run: cargo test --workspace generate -- --ignored --test-threads=1 --nocapture

    - name: Verify Rust interop consumers
      working-directory: rust
      run: cargo test --workspace

    - name: Verify TypeScript interop consumers
      working-directory: ts
      run: pnpm vitest run tests/interop.test.ts tests/*.interop.test.ts
