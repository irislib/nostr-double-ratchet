[package]
name = "sim-ndr"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
simnet = { path = "../simnet" }
iris-chat-protocol = { path = "../iris/chat-protocol" }
nostr-double-ratchet = { path = "../ndr/rust/crates/nostr-double-ratchet" }
nostr = { version = "0.44.7", default-features = false, features = ["std", "nip44"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
anyhow = "1"

[features]
context-recovery = []
group-broadcast = []
default = ["context-recovery"]

[profile.release]
debug = 1
